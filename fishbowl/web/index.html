<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>workflow-fishbowl</title>
<link rel="stylesheet" href="style.css">
<link rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%234aa3df'/%3E%3Ccircle cx='12' cy='13' r='2' fill='%23fff'/%3E%3Ccircle cx='20' cy='13' r='2' fill='%23fff'/%3E%3Cellipse cx='16' cy='20' rx='5' ry='3' fill='%23fff'/%3E%3C/svg%3E">
</head>
<body>
<header id="topbar">
  <div class="brand" id="brand">🐟 workflow-fishbowl</div>
  <div class="badges">
    <span id="mode-badge" class="badge">…</span>
    <span id="count-active" class="badge ok" hidden></span>
    <span id="count-stalled" class="badge bad" hidden></span>
    <span id="indexing" class="badge warn" hidden>indexing…</span>
  </div>
  <nav>
    <a href="#/" id="nav-sessions">Sessions</a>
    <a href="#/stats" id="nav-stats">Stats</a>
  </nav>
  <button id="theme-toggle" title="toggle theme" aria-label="toggle theme">◐</button>
</header>

<main>
  <section id="view-sessions" class="view"></section>
  <section id="view-session" class="view"></section>
  <section id="view-stats" class="view"></section>
</main>

<footer id="statusline">
  <span id="last-refresh">—</span>
  <span id="scan-info"></span>
</footer>

<script src="app.js"></script>
</body>
</html>
