name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: "Smoke: --dump on synthetic data"
        shell: bash
        run: |
          python - <<'EOF'
          import sys, tempfile
          sys.path.insert(0, ".")
          from pathlib import Path
          from datetime import datetime, timezone
          from fishbowl.fixtures_gen import make_fixture_tree
          root = Path(tempfile.mkdtemp()) / "projects"
          make_fixture_tree(root, now=datetime.now(timezone.utc))
          print("fixtures generated:", sorted(p.name for p in root.iterdir()))
          EOF

      - name: "Smoke: CLI help"
        run: python -m fishbowl --help
