[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fishbowl"
version = "0.1.0"
description = "Watch your Claude Code agents through the glass - a read-only local observability dashboard for long-running AI sessions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "fishbowl contributors" }]
keywords = ["claude-code", "observability", "monitoring", "dashboard", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/zonion088-design/fishbowl"

[project.scripts]
fishbowl = "fishbowl.__main__:main"

[tool.setuptools.packages.find]
include = ["fishbowl*"]

[tool.setuptools.package-data]
fishbowl = ["web/*", "prices.json"]
